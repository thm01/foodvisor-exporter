name: Build desktop app

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Tk on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - name: Check Python and Tk
        run: python -c "import tkinter; print(tkinter.TkVersion)"
      - name: Install packager
        run: python -m pip install pyinstaller==6.22.3 keyring
      - name: Build application
        run: python -m PyInstaller --noconfirm --onedir --windowed --collect-submodules keyring.backends --add-data app/translations.json:. --name FoodvisorExporter app/interface.py
      - uses: actions/upload-artifact@v4
        with:
          name: FoodvisorExporter-${{ matrix.os }}
          path: dist/
          if-no-files-found: error
